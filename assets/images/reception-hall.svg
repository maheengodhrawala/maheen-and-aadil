<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 253" width="380" height="253" role="img" aria-label="Reception Hall illustration">
  <defs>
    <linearGradient id="hallFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf4e6"/>
      <stop offset="100%" stop-color="#f2e4cc"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5d0ad"/>
      <stop offset="50%" stop-color="#f5e9d2"/>
      <stop offset="100%" stop-color="#e5d0ad"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow line -->
  <path d="M24 234 Q190 238 356 234" fill="none" stroke="#c8b08a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Left & Right Wings -->
  <rect x="44" y="118" width="76" height="114" fill="url(#hallFill)" stroke="#8c7258" stroke-width="1.3"/>
  <rect x="260" y="118" width="76" height="114" fill="url(#hallFill)" stroke="#8c7258" stroke-width="1.3"/>

  <!-- Wing Roofs -->
  <polygon points="38,118 82,92 124,118" fill="url(#roofGrad)" stroke="#8c7258" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="256,118 298,92 342,118" fill="url(#roofGrad)" stroke="#8c7258" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Wing Arched Windows -->
  <path d="M62 212 L62 152 A20 20 0 0 1 102 152 L102 212 Z" fill="#efe2ca" stroke="#8c7258" stroke-width="1.2"/>
  <line x1="82" y1="132" x2="82" y2="212" stroke="#a68d6c" stroke-width="0.9"/>
  <line x1="62" y1="168" x2="102" y2="168" stroke="#a68d6c" stroke-width="0.9"/>

  <path d="M278 212 L278 152 A20 20 0 0 1 318 152 L318 212 Z" fill="#efe2ca" stroke="#8c7258" stroke-width="1.2"/>
  <line x1="298" y1="132" x2="298" y2="212" stroke="#a68d6c" stroke-width="0.9"/>
  <line x1="278" y1="168" x2="318" y2="168" stroke="#a68d6c" stroke-width="0.9"/>

  <!-- Main Central Grand Hall -->
  <rect x="116" y="88" width="148" height="144" fill="url(#hallFill)" stroke="#7c6349" stroke-width="1.5"/>

  <!-- Grand Dome / Pediment Crown -->
  <path d="M132 88 C138 48, 242 48, 248 88 Z" fill="url(#roofGrad)" stroke="#7c6349" stroke-width="1.4"/>
  <line x1="190" y1="36" x2="190" y2="54" stroke="#a67d2b" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="190" cy="34" r="3" fill="#a67d2b"/>

  <!-- Cornice & Trim -->
  <rect x="110" y="84" width="160" height="8" rx="2" fill="#e8d6b7" stroke="#7c6349" stroke-width="1.2"/>

  <!-- Grand Arched Entrance -->
  <path d="M156 232 L156 146 A34 34 0 0 1 224 146 L224 232 Z" fill="#e9d8ba" stroke="#7c6349" stroke-width="1.5"/>
  <path d="M164 232 L164 150 A26 26 0 0 1 216 150 L216 232 Z" fill="#f7eedc" stroke="#a67d2b" stroke-width="1.1"/>
  <line x1="190" y1="124" x2="190" y2="232" stroke="#8c7258" stroke-width="1.2"/>

  <!-- Chandelier silhouette inside entrance arch -->
  <line x1="190" y1="126" x2="190" y2="140" stroke="#a67d2b" stroke-width="1"/>
  <path d="M180 144 Q190 150 200 144" fill="none" stroke="#a67d2b" stroke-width="1.2"/>
  <circle cx="182" cy="143" r="1.5" fill="#b48c3d"/>
  <circle cx="190" cy="145" r="1.8" fill="#b48c3d"/>
  <circle cx="198" cy="143" r="1.5" fill="#b48c3d"/>

  <!-- Decorative Side Pillars -->
  <rect x="128" y="96" width="10" height="136" fill="#efe1c6" stroke="#8c7258" stroke-width="1"/>
  <rect x="242" y="96" width="10" height="136" fill="#efe1c6" stroke="#8c7258" stroke-width="1"/>

  <!-- Steps -->
  <rect x="148" y="226" width="84" height="6" fill="#e7d5b5" stroke="#8c7258" stroke-width="1"/>
  <rect x="140" y="231" width="100" height="5" fill="#dfcaa6" stroke="#8c7258" stroke-width="1"/>

  <!-- Subtle Floral Bushes on Left & Right -->
  <path d="M26 232 C24 214, 42 208, 48 220 C54 212, 66 218, 62 232 Z" fill="#e8dec7" stroke="#8c7258" stroke-width="1.1"/>
  <path d="M318 232 C314 218, 326 212, 332 220 C338 208, 356 214, 354 232 Z" fill="#e8dec7" stroke="#8c7258" stroke-width="1.1"/>
</svg>
